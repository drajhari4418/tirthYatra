<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TirthYatra — Login / Sign up</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#fff8ee}.ty-auth-page{width:min(520px,92vw);padding:34px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.12);text-align:center}.ty-auth-page h1{margin-bottom:8px}.ty-auth-page p{margin-bottom:22px}#ty-auth-ui{display:block}#ty-auth-ui .ty-auth-bar{display:none!important}#ty-auth-ui .ty-auth-modal{position:static!important;inset:auto!important;background:transparent!important;padding:0!important;display:block}#ty-auth-ui .ty-auth-modal[hidden]{display:block!important}#ty-auth-ui .ty-auth-card{max-width:none!important;margin:0!important;padding:0!important;box-shadow:none!important}#ty-auth-ui #ty-auth-close{display:none}</style></head><body><main class="ty-auth-page"><h1>TirthYatra</h1><p>Sign in or create your account to continue to the pilgrimage website.</p><div id="auth-loading">Loading secure authentication…</div></main><script type="module" src="js/auth-ui.js"></script><script type="module">import("./js/firebase-app.js").then(()=>{const wait=setInterval(()=>{const m=document.getElementById("ty-auth-modal");const l=document.getElementById("auth-loading");if(m){m.hidden=false;if(l)l.remove();clearInterval(wait)}},50)})</script></body></html>
